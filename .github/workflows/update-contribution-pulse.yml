name: Update Contribution Pulse

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate_contribution_pulse.py'
      - '.github/workflows/update-contribution-pulse.yml'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"query":"query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}","variables":{"login":"Aditya1809-08"}}' \
            https://api.github.com/graphql > /tmp/contributions.json

      - name: Generate contribution pulse
        run: python3 scripts/generate_contribution_pulse.py

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-pulse.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update contribution pulse"
          git push
